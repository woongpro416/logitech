services:
  db:
    image: postgres:16-alpine
    container_name: logitech-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logitech
      POSTGRES_USER: logitech
      POSTGRES_PASSWORD: logitech1234
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - logitech-postgres-data:/var/lib/postgresql/data
      - ./logitech-backend/postgresql/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitech -d logitech"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./logitech-backend/logitech
    container_name: logitech-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logitech
      SPRING_DATASOURCE_USERNAME: logitech
      SPRING_DATASOURCE_PASSWORD: logitech1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./logitech-frontend/logitech-vue
      args:
        VITE_API_BASE_URL: /api
    container_name: logitech-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  logitech-postgres-data:
